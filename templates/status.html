{% extends 'base.html' %}

{% block title %}Download Status{% endblock %}

{% block content %}
<style>
  .action-icon {
    transition: all 0.2s ease;
    padding: 5px;
    border-radius: 4px;
  }
  
  .action-icon:hover {
    transform: scale(1.1);
    background-color: rgba(0,0,0,0.1);
  }
  
  .text-danger.action-icon:hover {
    background-color: rgba(220,53,69,0.1);
  }
  
  .text-primary.action-icon:hover {
    background-color: rgba(13,110,253,0.1);
  }
</style>

<div class="container my-5">
    <h2>Download Status</h2>
    <button id="clear-downloads-btn" class="btn btn-primary mb-3">
      Clear Completed/Cancelled Downloads
    </button>
    <button id="clear-errors-btn" class="btn btn-danger mb-3 ms-2">
      Clear Failed Downloads
    </button>
    <table class="table table-striped" id="downloads-table">
      <thead>
        <tr>
          <th>Filename</th>
          <th>Provider</th>
          <th>Progress</th>
          <th>Downloaded</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
{% endblock %}

{% block scripts %}
{{ super() }}
    <script>
    // Provider/client icon definitions, keyed by provider or client_type.
    const providerMap = {
      pixeldrain:   { icon: 'bi-cloud-arrow-down', color: 'text-primary',  label: 'Pixeldrain' },
      mega:         { img: 'https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/mega-nz.png', label: 'Mega' },
      getcomics:    { icon: 'bi-download',         color: 'text-success',  label: 'GetComics' },
      comicbookplus:{ icon: 'bi-book',             color: 'text-info',     label: 'CBP' },
      sabnzbd:      { icon: 'bi-hdd-network',      color: 'text-warning',  label: 'SABnzbd' },
      nzbget:       { icon: 'bi-cloud-download',   color: 'text-info',     label: 'NZBGet' },
      airdcpp:      { icon: 'bi-diagram-3',        color: 'text-primary',  label: 'AirDC++' },
    };

    const mb = bytes => (bytes / (1024 * 1024)).toFixed(2);

    // Countdown for a download waiting out its auto-retry backoff. The seconds
    // come from the server (details.retry_in) so the figure can't drift with a
    // browser clock that disagrees with the container's.
    function formatCountdown(seconds) {
      const total = Math.max(0, Math.round(seconds || 0));
      const mins = Math.floor(total / 60);
      const secs = total % 60;
      return `${mins}m ${String(secs).padStart(2, '0')}s`;
    }

    // Shared cell builders so direct and Usenet rows render identically.
    function providerCell(providerKey) {
      const td = document.createElement('td');
      const prov = providerMap[providerKey];
      if (prov && prov.img) {
        td.innerHTML = `<img src="${prov.img}" alt="${prov.label}" title="${prov.label}" style="width:18px;height:18px;vertical-align:text-bottom;"> <small>${prov.label}</small>`;
      } else if (prov) {
        td.innerHTML = `<i class="bi ${prov.icon} ${prov.color}" title="${prov.label}"></i> <small>${prov.label}</small>`;
      } else {
        td.innerHTML = '<i class="bi bi-hourglass-split text-muted" title="Pending"></i>';
      }
      return td;
    }

    function progressCell(progress) {
      const pct = Math.max(0, Math.min(100, Math.round(progress || 0)));
      const td = document.createElement('td');
      const progressBar = document.createElement('div');
      progressBar.className = 'progress';
      const progressInner = document.createElement('div');
      progressInner.className = 'progress-bar';
      progressInner.style.width = pct + '%';
      progressInner.setAttribute('aria-valuenow', pct);
      progressInner.setAttribute('aria-valuemin', '0');
      progressInner.setAttribute('aria-valuemax', '100');
      progressInner.textContent = pct + '%';
      progressBar.appendChild(progressInner);
      td.appendChild(progressBar);
      return td;
    }

    function bytesCell(downloaded, total) {
      const td = document.createElement('td');
      if (total && downloaded) {
        td.textContent = `${mb(downloaded)} MB / ${mb(total)} MB`;
      } else {
        td.textContent = '—';
      }
      return td;
    }

    function statusCell(text, cssClass, title) {
      const td = document.createElement('td');
      td.textContent = text;
      if (cssClass) td.className = cssClass;
      if (title) td.title = title;
      return td;
    }

    function filenameCell(filename) {
      const td = document.createElement('td');
      td.textContent = filename ? filename.split('/').pop() : 'N/A';
      return td;
    }

    // Map a managed-client job's status/stage to a display label + styling.
    // Shared by Usenet (SABnzbd/NZBGet) and DC++ (AirDC++), which report the
    // same status vocabulary.
    function clientStatusDisplay(job) {
      switch (job.status) {
        case 'complete':
          return { text: 'Complete', cssClass: 'text-success' };
        case 'complete_no_move':
          return { text: 'Complete (import pending)', cssClass: 'text-warning',
                   title: 'Finished at the client but CLU could not move the file into WATCH' };
        case 'failed':
          return { text: 'Failed', cssClass: 'text-danger fw-bold', title: job.error || 'Download failed at client' };
        default:
          return { text: job.stage || 'Downloading', cssClass: '' };
      }
    }

    // A Cloudflare-blocked download carries the original GetComics link in
    // `manual_url` (set by api.py's challenge branch and preserved across
    // mirror failover). Only http(s) links are offered: the value ends up in an
    // anchor, and a javascript:/data: URL there would be a script-injection
    // vector if the field were ever fed from somewhere less trustworthy.
    function manualDownloadUrl(details) {
      const url = details && details.manual_url;
      if (typeof url !== 'string') return null;
      return /^https?:\/\//i.test(url.trim()) ? url.trim() : null;
    }

    // Link button that opens the source page so the user can clear the
    // challenge in a real browser and download the file by hand.
    function manualDownloadLink(url) {
      const a = document.createElement('a');
      a.href = url;            // set as a property, never interpolated into HTML
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'btn btn-sm btn-warning me-2';
      a.title = 'Cloudflare blocked the automatic download — open the source page and download it manually';
      a.innerHTML = '<i class="bi bi-box-arrow-up-right me-1"></i>Download manually';
      return a;
    }

    // Render direct (api.py) download rows into the table body.
    function renderDirectRows(tbody, data) {
      for (const [downloadId, details] of Object.entries(data)) {
            const tr = document.createElement('tr');
            tr.appendChild(filenameCell(details.filename));
            tr.appendChild(providerCell(details.provider));
            tr.appendChild(progressCell(details.progress));
            tr.appendChild(bytesCell(details.bytes_downloaded, details.bytes_total));

            // Status
            let statusClass = '';
            let statusText = details.status;
            let statusTitle = details.error;
            if (details.status === 'error') {
              statusClass = 'text-danger fw-bold';
              if (manualDownloadUrl(details)) {
                // Cloudflare: the mirror answered with a managed challenge, which
                // no automated client can pass. Say so plainly instead of leaving
                // the user staring at a bare "error" they can't act on — the
                // Actions column carries the link that does work.
                statusText = 'Blocked by Cloudflare';
                statusClass = 'text-warning fw-bold';
                statusTitle = 'This mirror is protected by a Cloudflare challenge '
                            + 'that cannot be bypassed automatically. Use the link '
                            + 'in Actions to download it in your browser.';
              }
            } else if (details.status === 'complete') {
              statusClass = 'text-success';
            } else if (details.status === 'cancelled') {
              statusClass = 'text-warning';
            } else if (details.status === 'retry_pending') {
              // Failed, but CLU is going to try again on its own. Show the wait
              // and which attempt is coming; the last error stays on the hover
              // title so it's still inspectable.
              statusClass = 'text-warning';
              statusText = `Retrying in ${formatCountdown(details.retry_in)}`
                         + ` (${details.retry_count} of ${details.retry_max})`;
            }
            tr.appendChild(statusCell(statusText, statusClass, statusTitle));

            // Actions cell (Cancel/Retry buttons)
            const tdActions = document.createElement('td');

            // A pending retry is still in flight — offer Cancel, not Retry.
            if (details.status === 'in_progress' || details.status === 'queued'
                || details.status === 'retry_pending') {
              // Cancel button for in-progress downloads
              const cancelIcon = document.createElement('i');
              cancelIcon.className = "bi bi-x-circle text-danger action-icon";
              cancelIcon.style.cursor = "pointer";
              cancelIcon.style.fontSize = "1.2em";
              cancelIcon.title = "Cancel download";
              cancelIcon.addEventListener('click', () => {
                showConfirmToast('Are you sure you want to cancel this download?', () => {
                  // The worker stops cooperatively — it may take a chunk or a
                  // stalled read to notice — so refresh rather than assume.
                  fetch(`/cancel_download/${downloadId}`, { method: 'POST' })
                    .then(response => response.json().then(data => {
                      if (!response.ok) throw new Error(data.error || 'Cancel failed');
                      return data;
                    }))
                    .then(data => {
                      showToast('Download cancelled', 'success');
                      fetchStatus();
                    })
                    .catch(error => {
                      showToast(error.message || 'Error cancelling download', 'error');
                    });
                });
              });
              tdActions.appendChild(cancelIcon);
            } else if (details.status === 'error') {
              // Cloudflare failures come first: retrying is pointless there, so
              // lead with the link that actually gets the file.
              const manualUrl = manualDownloadUrl(details);
              if (manualUrl) {
                tdActions.appendChild(manualDownloadLink(manualUrl));
              }

              // Retry button for error status
              const retryIcon = document.createElement('i');
              retryIcon.className = "bi bi-arrow-clockwise text-primary action-icon";
              retryIcon.style.cursor = "pointer";
              retryIcon.style.fontSize = "1.2em";
              retryIcon.title = "Retry download";
              retryIcon.addEventListener('click', () => {
                showConfirmToast('Are you sure you want to retry this download?', () => {
                  fetch(`/retry_download/${downloadId}`, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                      console.log(data.message);
                      showToast('Download retried', 'success');
                      // Refresh the table to show updated status
                      fetchStatus();
                    })
                    .catch(error => {
                      console.error('Error retrying download:', error);
                      showToast('Error retrying download', 'error');
                    });
                });
              });
              tdActions.appendChild(retryIcon);

              // Dismiss button for error status
              const dismissIcon = document.createElement('i');
              dismissIcon.className = "bi bi-trash text-muted action-icon ms-2";
              dismissIcon.style.cursor = "pointer";
              dismissIcon.style.fontSize = "1.2em";
              dismissIcon.title = "Dismiss failed download";
              dismissIcon.addEventListener('click', () => {
                showConfirmToast('Remove this failed download?', () => {
                  fetch(`/dismiss_download/${downloadId}`, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                      showToast('Download dismissed', 'success');
                      fetchStatus();
                    })
                    .catch(error => {
                      showToast('Error dismissing download', 'error');
                    });
                });
              });
              tdActions.appendChild(dismissIcon);
            } else {
              // No action buttons for completed/cancelled downloads
              tdActions.textContent = '';
            }
            tr.appendChild(tdActions);

            tbody.appendChild(tr);
      }
    }

    // Render externally-managed client rows (Usenet SABnzbd/NZBGet, DC++
    // AirDC++). Cancel/retry belong in the user's own client, not here, so the
    // only action offered is dismissing a job CLU can no longer resolve.
    function renderClientRows(tbody, downloads, dismissUrl) {
      for (const job of downloads) {
        const tr = document.createElement('tr');
        if (job.untracked) tr.className = 'text-muted';
        tr.appendChild(filenameCell(job.filename));
        tr.appendChild(providerCell(job.client_type));
        const isDone = job.status === 'complete' || job.status === 'complete_no_move';
        tr.appendChild(progressCell(isDone ? 100 : job.percent));
        tr.appendChild(bytesCell(job.bytes_downloaded, job.bytes_total));

        if (job.untracked) {
          // Queued directly in the client, not by CLU. Shown so the panel
          // matches the client's real queue, but CLU has no idea what series
          // or issue it is and must never move its files.
          tr.appendChild(statusCell('Not tracked by CLU', 'text-muted fst-italic',
            'Queued directly in the client — CLU will not import this'));
          tr.appendChild(document.createElement('td'));
          tbody.appendChild(tr);
          continue;
        }

        const disp = clientStatusDisplay(job);
        tr.appendChild(statusCell(disp.text, disp.cssClass, disp.title));

        // Only unresolved jobs are dismissable: a clean completion clears
        // itself, while a failure or an unimported file is waiting on a human.
        const tdActions = document.createElement('td');
        const needsAck = job.status === 'failed' || job.status === 'complete_no_move';
        if (dismissUrl && needsAck && job.download_id) {
          const dismissIcon = document.createElement('i');
          dismissIcon.className = "bi bi-trash text-muted action-icon";
          dismissIcon.style.cursor = "pointer";
          dismissIcon.style.fontSize = "1.2em";
          dismissIcon.title = "Dismiss this download";
          dismissIcon.addEventListener('click', () => {
            showConfirmToast('Remove this download from the list?', () => {
              fetch(dismissUrl(job.download_id), { method: 'POST' })
                .then(response => response.json())
                .then(() => {
                  showToast('Download dismissed', 'success');
                  fetchStatus();
                })
                .catch(() => showToast('Error dismissing download', 'error'));
            });
          });
          tdActions.appendChild(dismissIcon);
        }
        tr.appendChild(tdActions);
        tbody.appendChild(tr);
      }
    }

    // A managed-client endpoint may 404/500 when that source is unconfigured —
    // never let it break the poll.
    function fetchClientDownloads(url, signal) {
      return fetch(url, { signal })
        .then(r => r.ok ? r.json() : { success: false })
        .then(d => (d && d.success && Array.isArray(d.downloads)) ? d.downloads : [])
        .catch(() => []);
    }

    // Fetch direct (api.py), Usenet and DC++ download statuses and rebuild the table.
    function fetchStatus(signal) {
      const direct = fetch('/download_status_all', { signal })
        .then(r => r.json())
        .catch(() => ({}));
      const usenet = fetchClientDownloads('/api/usenet/downloads', signal);
      const dcpp = fetchClientDownloads('/api/dcpp/downloads', signal);
      return Promise.all([direct, usenet, dcpp]).then(([data, usenetDownloads, dcppDownloads]) => {
        const tbody = document.querySelector('#downloads-table tbody');
        tbody.innerHTML = ''; // Clear previous rows.
        renderDirectRows(tbody, data || {});
        renderClientRows(tbody, usenetDownloads);
        renderClientRows(tbody, dcppDownloads,
          id => `/api/dcpp/downloads/${encodeURIComponent(id)}/dismiss`);
      });
    }

    // Event listener for the Clear Completed/Cancelled Downloads button.
    document.getElementById('clear-downloads-btn').addEventListener('click', function() {
      showConfirmToast('This will clear all completed and cancelled downloads. Continue?', () => {
        fetch('/clear_downloads', { method: 'POST' })
          .then(response => response.json())
          .then(data => {
            console.log(data.message);
            showToast('Downloads cleared', 'success');
            // Refresh the table after clearing
            fetchStatus();
          })
          .catch(error => {
            console.error('Error clearing downloads:', error);
            showToast('Error clearing downloads', 'error');
          });
      });
    });

    // Event listener for the Clear Failed Downloads button.
    document.getElementById('clear-errors-btn').addEventListener('click', function() {
      showConfirmToast('This will clear all failed downloads. Continue?', () => {
        fetch('/clear_failed_downloads', { method: 'POST' })
          .then(response => response.json())
          .then(data => {
            console.log(data.message);
            showToast('Failed downloads cleared', 'success');
            fetchStatus();
          })
          .catch(error => {
            console.error('Error clearing failed downloads:', error);
            showToast('Error clearing failed downloads', 'error');
          });
      });
    });

    // Poll the status endpoint every second (guarded: no overlap, self-aborts).
    CLU.startPoll(fetchStatus, 1000);

    // Toast notification system for status.html
    function showToast(message, type = 'info', duration = 5000) {
        // Create toast container if it doesn't exist
        let container = document.getElementById('toast-container');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toast-container';
            container.className = 'toast-container position-fixed top-0 end-0 p-3';
            container.style.zIndex = '9999';
            document.body.appendChild(container);
        }

        const toastId = 'toast-' + Date.now();
        const iconMap = {
            'success': 'bi-check-circle-fill text-success',
            'error': 'bi-exclamation-triangle-fill text-danger',
            'warning': 'bi-exclamation-triangle-fill text-warning',
            'info': 'bi-info-circle-fill text-info'
        };

        const toastHtml = `
            <div id="${toastId}" class="toast bg-white border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <i class="bi ${iconMap[type]} me-2"></i>
                    <strong class="me-auto">${type.charAt(0).toUpperCase() + type.slice(1)}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    ${message}
                </div>
            </div>
        `;

        container.insertAdjacentHTML('beforeend', toastHtml);
        const toastElement = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastElement, {
            delay: duration,
            autohide: duration > 0
        });

        toast.show();

        // Remove from DOM after hiding
        toastElement.addEventListener('hidden.bs.toast', () => {
            toastElement.remove();
        });

        return toast;
    }

    // Confirmation toast with Yes/No buttons
    function showConfirmToast(message, callback) {
        const container = document.getElementById('toast-container') || (() => {
            const div = document.createElement('div');
            div.id = 'toast-container';
            div.className = 'toast-container position-fixed top-0 end-0 p-3';
            div.style.zIndex = '9999';
            document.body.appendChild(div);
            return div;
        })();

        const toastId = 'confirm-toast-' + Date.now();
        const toastHtml = `
            <div id="${toastId}" class="toast bg-white border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <i class="bi bi-question-circle-fill text-warning me-2"></i>
                    <strong class="me-auto">Confirm</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    <p class="mb-3">${message}</p>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-danger btn-sm confirm-yes">Yes</button>
                        <button type="button" class="btn btn-secondary btn-sm confirm-no">No</button>
                    </div>
                </div>
            </div>
        `;

        container.insertAdjacentHTML('beforeend', toastHtml);
        const toastElement = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastElement, {
            autohide: false // Don't auto-hide confirmation toasts
        });

        // Add event listeners for Yes/No buttons
        toastElement.querySelector('.confirm-yes').addEventListener('click', () => {
            callback();
            toast.hide();
        });

        toastElement.querySelector('.confirm-no').addEventListener('click', () => {
            toast.hide();
        });

        toast.show();

        // Remove from DOM after hiding
        toastElement.addEventListener('hidden.bs.toast', () => {
            toastElement.remove();
        });

        return toast;
    }
    </script>
{% endblock %}
