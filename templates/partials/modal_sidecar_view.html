<!-- View cvinfo + series.json Modal – shared partial (clu-series-json.js) -->
<div class="modal fade" id="sidecarViewModal" tabindex="-1" aria-labelledby="sidecarViewModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="sidecarViewModalLabel"><i class="bi bi-eye me-2"></i>Folder Info Files</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="text-muted small mb-3">Folder: <span id="sidecarViewFolder"></span></div>
        <h6>cvinfo</h6>
        <pre class="border rounded p-2 small mb-4" id="sidecarViewCvinfo" style="white-space: pre-wrap; word-break: break-word;"></pre>
        <h6>series.json</h6>
        <pre class="border rounded p-2 small mb-0" id="sidecarViewSeriesJson" style="white-space: pre-wrap; word-break: break-word;"></pre>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
